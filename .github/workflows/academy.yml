# academy.coralpetal.ai — PRODUCTION Academy = WordPress + Tutor LMS (since Release 1.0001).
#
#   push to main that touches academy-wp/ → checks → WAIT FOR ROHIT'S APPROVAL (production environment)
#   → scripts/academy_wp_prod.sh (theme, mu-plugins, courses/pages via WP-CLI, mail secret) → verify.
#
# The old static Academy (academy/ folder) is NOT deployed any more: on the first run the script moves
# its files on the server to ~/retired/academy-static-<ts>/. scripts/academy_wp_prod.sh refuses any
# path but ~/domains/coralpetal.ai/public_html/academy.
name: Academy deploy

on:
  push:
    branches: [main]
    paths:
      - 'academy-wp/**'
      - 'scripts/academy_wp_prod.sh'
      - '.github/workflows/academy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-academy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    name: Academy checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Script syntax
        run: |
          bash -n scripts/academy_wp_prod.sh
          bash -n academy-wp/remote_setup.sh
      - name: PHP syntax (theme + mu-plugins)
        run: |
          for f in $(find academy-wp -name '*.php'); do php -l "$f" >/dev/null || { php -l "$f"; exit 1; }; done
          echo "php ok"

  deploy:
    name: Deploy · Academy (WordPress)
    if: github.ref_name == 'main'
    needs: checks
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://academy.coralpetal.ai
    env:
      SITE_URL: https://academy.coralpetal.ai
      HOSTINGER_HOST: ${{ vars.HOSTINGER_HOST }}
      HOSTINGER_PORT: ${{ vars.HOSTINGER_PORT }}
      HOSTINGER_USER: ${{ vars.HOSTINGER_USER }}
    steps:
      - uses: actions/checkout@v4
      - name: SSH setup (pinned host keys)
        env:
          KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          KNOWN: ${{ vars.HOSTINGER_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id && chmod 600 ~/.ssh/id
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
      - name: Apply the Academy WordPress build
        env:
          ACADEMY_SMTP_USER: ${{ secrets.ACADEMY_SMTP_USER }}
          ACADEMY_SMTP_TOKEN: ${{ secrets.ACADEMY_SMTP_TOKEN }}
          ACADEMY_PROD_WP: ${{ secrets.ACADEMY_PROD_WP }}
        run: bash scripts/academy_wp_prod.sh
      - name: Verify the live Academy (WordPress, course catalog)
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -m 15 -o /tmp/a.html -w '%{http_code}' "$SITE_URL/courses/?ci=$RANDOM" || true)
            echo "attempt $i: $code"
            if [ "$code" = 200 ] || [ "$code" = 503 ]; then
              grep -qi 'wp-content/themes/coralpetal-academy\|cp-maint\|be back soon' /tmp/a.html && echo "✅ WordPress Academy answering ($code)" && exit 0
            fi
            sleep 10
          done
          echo "::error::$SITE_URL/courses/ is not serving the WordPress Academy"; exit 1
      - name: Check the main site is untouched
        run: |
          curl -s -m 10 -o /dev/null -w 'main %{http_code}\n' https://coralpetal.ai/
          curl -s -m 10 -o /dev/null -w 'careers %{http_code}\n' https://careers.coralpetal.ai/
      - name: Remove key
        if: always()
        run: rm -f ~/.ssh/id
